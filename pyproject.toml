[project]
name = "jax-whose-laptop-is-better"
version = "0.1.0"
description = "A tiny JAX benchmark for highly serious laptop bragging rights."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jax>=0.10,<0.11",
]

[project.optional-dependencies]
mps = [
    "jax-mps==0.10.1; sys_platform == 'darwin' and platform_machine == 'arm64' and python_version >= '3.13'",
]
